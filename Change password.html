<!DOCTYPE html>
<html>
<head>
  <title>Change Password</title>
  <style>
    body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f3f4f6; }
    .box { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 350px; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; }
    h2 { text-align: center; color: #2563eb; }
    #msg { text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Change Password</h2>
    <input type="password" id="old-pass" placeholder="Current Password">
    <input type="password" id="new-pass" placeholder="New Password">
    <input type="password" id="confirm-pass" placeholder="Confirm New Password">
    <button onclick="changePassword()">Update Password</button>
    <p id="msg"></p>
  </div>

  <script>
    function changePassword() {
      const oldPass = document.getElementById('old-pass').value;
      const newPass = document.getElementById('new-pass').value;
      const confirmPass = document.getElementById('confirm-pass').value;
      const msg = document.getElementById('msg');

      if (newPass !== confirmPass) {
        msg.innerHTML = '<span style="color:red">Passwords do not match</span>';
        return;
      }

      // Use CORRECT localStorage keys
      const session = JSON.parse(localStorage.getItem('invoice_auth_session'));
      if (!session) {
        msg.innerHTML = '<span style="color:red">Not logged in</span>';
        return;
      }

      const users = JSON.parse(localStorage.getItem('invoice_auth_users')) || {};
      const user = users[session.email];

      if (!user) {
        msg.innerHTML = '<span style="color:red">User not found</span>';
        return;
      }

      if (user.password !== oldPass) {
        msg.innerHTML = '<span style="color:red">Current password is wrong</span>';
        return;
      }

      users[session.email].password = newPass;
      delete users[session.email].tempPassword;
      localStorage.setItem('invoice_auth_users', JSON.stringify(users));

      msg.innerHTML = '<span style="color:green">✅ Password changed!</span>';
      setTimeout(() => window.location.href = 'index.html', 1500);
    }
  </script>
</body>
</html>
